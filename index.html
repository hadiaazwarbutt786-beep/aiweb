  const [wishlist, setWishlist] = useState(() => {
    try {
      const saved = localStorage.getItem('velora_wishlist');
      return saved ? JSON.parse(saved) : [1, 3, 5];
    } catch (e) {
      return [];
    }
  });

  // UI Modals & Overlays
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isWishlistOpen, setIsWishlistOpen] = useState(false);
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [isAuthOpen, setIsAuthOpen] = useState(false);
  const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
  const [quickViewProduct, setQuickViewProduct] = useState(null);
  const [isSizeGuideOpen, setIsSizeGuideOpen] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [showBackToTop, setShowBackToTop] = useState(false);

  // User State
  const [user, setUser] = useState(() => {
    try {
      const saved = localStorage.getItem('velora_user');
      return saved ? JSON.parse(saved) : null;
    } catch (e) {
      return null;
    }
  });

  // Toast Notifications
  const [toast, setToast] = useState(null);

  // Active Promo Code
  const [promoCode, setPromoCode] = useState('');
  const [appliedPromo, setAppliedPromo] = useState(null); // { code: 'VELORA10', discount: 0.1 }

  // Last Placed Order Details
  const [lastOrder, setLastOrder] = useState(null);

  // Persist Cart & Wishlist to localStorage
  useEffect(() => {
    localStorage.setItem('velora_cart', JSON.stringify(cart));
  }, [cart]);

  useEffect(() => {
    localStorage.setItem('velora_wishlist', JSON.stringify(wishlist));
  }, [wishlist]);

  // Back-to-Top scroll listener
  useEffect(() => {
    const handleScroll = () => {
      setShowBackToTop(window.scrollY > 400);
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  // Scroll to top on view change
  const navigateTo = (view, productId = null) => {
    setCurrentView(view);
    if (productId) setSelectedProductId(productId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setMobileMenuOpen(false);
  };

  // Toast Dispatcher Helper
  const showToast = (message, type = 'success') => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 3500);
  };

  // Cart Operations
  const addToCart = (product, size = 'M', color = null, quantity = 1) => {
    const selectedColor = color || (product.colors && product.colors[0]) || { name: 'Standard', hex: '#111' };
    const cartItemId = `${product.id}-${size}-${selectedColor.name}`;

    setCart(prev => {
      const existing = prev.find(item => item.id === cartItemId);
      if (existing) {
        return prev.map(item =>
          item.id === cartItemId
            ? { ...item, quantity: item.quantity + quantity }
            : item
        );
      } else {
        return [
          ...prev,
          {
            id: cartItemId,
            productId: product.id,
            size,
            color: selectedColor.name,
            colorHex: selectedColor.hex,
            quantity
          }
        ];
      }
    });

    showToast(`Added "${product.name}" to your shopping bag.`);
    setIsCartOpen(true);
  };

  const updateCartQuantity = (cartItemId, newQty) => {
    if (newQty <= 0) {
      removeFromCart(cartItemId);
      return;
    }
    setCart(prev => prev.map(item => item.id === cartItemId ? { ...item, quantity: newQty } : item));
  };

  const removeFromCart = (cartItemId) => {
    setCart(prev => prev.filter(item => item.id !== cartItemId));
    showToast("Item removed from your bag.", "info");
  };

  const clearCart = () => {
    setCart([]);
  };

  // Wishlist Operations
  const toggleWishlist = (productId) => {
    setWishlist(prev => {
      const exists = prev.includes(productId);
      if (exists) {
        showToast("Removed from your wishlist.", "info");
        return prev.filter(id => id !== productId);
      } else {
        showToast("Added to your wishlist!");
        return [...prev, productId];
      }
    });
  };

  // Promo Code Handler
  const handleApplyPromo = (codeToApply) => {
    const code = (codeToApply || promoCode).trim().toUpperCase();
    if (code === 'VELORA10') {
      setAppliedPromo({ code: 'VELORA10', rate: 0.1, label: '10% Welcome Luxury Discount' });
      showToast("Promo code VELORA10 applied! 10% discount added.");
    } else if (code === 'VIP20') {
      setAppliedPromo({ code: 'VIP20', rate: 0.2, label: '20% VIP Client Privilege' });
      showToast("VIP code applied! 20% discount added.");
    } else {
      showToast("Invalid promotional code. Try VELORA10", "error");
    }
  };

  // Financial Calculations
  const cartSubtotal = useMemo(() => {
    return cart.reduce((acc, item) => {
      const product = window.VELORA_DATA.products.find(p => p.id === item.productId);
      return acc + (product ? product.price * item.quantity : 0);
    }, 0);
  }, [cart]);

  const discountAmount = useMemo(() => {
    return appliedPromo ? Math.round(cartSubtotal * appliedPromo.rate) : 0;
  }, [cartSubtotal, appliedPromo]);

  const shippingCost = cartSubtotal >= 150 || cartSubtotal === 0 ? 0 : 25;
  const estimatedTax = Math.round((cartSubtotal - discountAmount) * 0.08);
  const cartTotal = Math.max(0, cartSubtotal - discountAmount + shippingCost + estimatedTax);
  const totalCartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

  // Selected Product Reference
  const selectedProduct = useMemo(() => {
    return window.VELORA_DATA.products.find(p => p.id === selectedProductId) || window.VELORA_DATA.products[0];
  }, [selectedProductId]);

              </button>

              <button

              {/* Wishlist Icon with Badge */}

              {/* Shopping Cart Drawer Trigger with Count */}

              </button>
            </div>

          </div>
        </div>
      </header>

      {/* MOBILE NAVIGATION DRAWER */}
      {mobileMenuOpen && (

                    {window.VELORA_DATA.categories.filter(c => c.id !== 'all').map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => { setSelectedCategory(cat.id); navigateTo('shop'); }}
                        className="block w-full text-left py-1 text-sm text-stone-700 hover:text-black"
                      >
                        {cat.name} ({cat.count})
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={() => navigateTo('about')}
                  className="block w-full text-left py-2.5 text-sm uppercase tracking-widest font-semibold text-stone-900 border-b border-stone-200"
                >
                  About Velora
                </button>
                <button
                  onClick={() => navigateTo('contact')}
                  className="block w-full text-left py-2.5 text-sm uppercase tracking-widest font-semibold text-stone-900 border-b border-stone-200"
                >
                  Contact Concierge
                </button>
              </div>

            <div className="pt-6 border-t border-[#E8DFD5] space-y-3">
              {user ? (
                <div className="text-sm text-stone-700">
                  Signed in as <span className="font-semibold text-black">{user.name}</span>

              ) : (
                <button
                  onClick={() => { setMobileMenuOpen(false); setIsAuthOpen(true); }}

                  Sign In / Register

              <div className="text-xs text-stone-500 text-center">
                Concierge: contact@velora-fashion.com
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 3. ACTIVE ROUTE VIEW RENDERER */}
      <main className="flex-grow">
        {currentView === 'home' && (
          <HomePage
            navigateTo={navigateTo}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            setQuickViewProduct={setQuickViewProduct}
            setSelectedCategory={setSelectedCategory}
            showToast={showToast}
          />
        )}

        {currentView === 'shop' && (
          <ShopPage
            navigateTo={navigateTo}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            setQuickViewProduct={setQuickViewProduct}
            selectedCategory={selectedCategory}
            setSelectedCategory={setSelectedCategory}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            priceRange={priceRange}
            setPriceRange={setPriceRange}
            sortBy={sortBy}
            setSortBy={setSortBy}
            filterOnlyInStock={filterOnlyInStock}
            setFilterOnlyInStock={setFilterOnlyInStock}
          />
        )}

        {currentView === 'product' && (
          <ProductDetailPage
            product={selectedProduct}
            navigateTo={navigateTo}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            setIsSizeGuideOpen={setIsSizeGuideOpen}
            showToast={showToast}
          />
        )}

        {currentView === 'cart' && (
          <CartPage
            cart={cart}
            updateCartQuantity={updateCartQuantity}
            removeFromCart={removeFromCart}
            navigateTo={navigateTo}
            cartSubtotal={cartSubtotal}
            discountAmount={discountAmount}
            shippingCost={shippingCost}
            estimatedTax={estimatedTax}
            cartTotal={cartTotal}
            appliedPromo={appliedPromo}
            handleApplyPromo={handleApplyPromo}
            promoCode={promoCode}
            setPromoCode={setPromoCode}
          />
        )}

        {currentView === 'checkout' && (
          <CheckoutPage
            cart={cart}
            cartSubtotal={cartSubtotal}
            discountAmount={discountAmount}
            shippingCost={shippingCost}
            estimatedTax={estimatedTax}
            cartTotal={cartTotal}
            appliedPromo={appliedPromo}
            navigateTo={navigateTo}
            clearCart={clearCart}
            setLastOrder={setLastOrder}
            lastOrder={lastOrder}
            showToast={showToast}
          />
        )}

        {currentView === 'about' && (
          <AboutPage navigateTo={navigateTo} />
        )}

        {currentView === 'contact' && (
          <ContactPage showToast={showToast} />
        )}
      </main>

      {/* 4. CART SLIDE-OVER DRAWER */}
      {isCartOpen && (
        <div className="fixed inset-0 z-50 overflow-hidden">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)} />
          <div className="fixed inset-y-0 right-0 pl-10 max-w-full flex">
            <div className="w-screen max-w-md bg-[#FAF7F2] shadow-2xl flex flex-col justify-between">

              <div className="p-6 border-b border-[#E8DFD5] flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="ShoppingBag" className="w-5 h-5 text-stone-800" />

                <button onClick={() => setIsCartOpen(false)} className="p-1 text-stone-500 hover:text-black">
                  <Icon name="X" className="w-5 h-5" />
                </button>
              </div>

              {/* Free Shipping Progress Indicator */}
              <div className="bg-[#F3EBE1] px-6 py-3 border-b border-[#E8DFD5] text-xs">

                  </div>
                ) : (
                  <div>
                    <span className="text-stone-700">
                      Add <strong>${150 - cartSubtotal}</strong> more for Complimentary Express Shipping
                    </span>

                    <p className="text-xs text-stone-500 mb-6">Discover our newest luxury jacket arrivals.</p>

                    p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||

                        p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||

                        </div>

                    </div>

            </div>

            <div className="p-3 bg-stone-50 border-t border-stone-200 text-right">
              <button
                onClick={() => {

                View all in shop →

          </div>
        </div>

      {/* 7. AUTHENTICATION MODAL (Login / Register) */}
      {isAuthOpen && (
        <AuthModal
          authMode={authMode}

          onClose={() => setIsAuthOpen(false)}

      {/* 9. SIZE GUIDE MODAL */}
      {isSizeGuideOpen && (

      {/* BACK TO TOP FLOATING BUTTON */}
      {showBackToTop && (

          <Icon name="ArrowUp" className="w-5 h-5" />
        </button>
      )}

      {/* 10. LUXURY FOOTER */}
      <Footer
        navigateTo={navigateTo}
        setSelectedCategory={setSelectedCategory}
        showToast={showToast}
      />

    </div>
  );
}

// 6. SHOP PAGE COMPONENT (Complete filters, sorting, categories, search)

function ShopPage({
  navigateTo,
  onAddToCart,
  onToggleWishlist,
  wishlist,
  setQuickViewProduct,
  selectedCategory,
  setSelectedCategory,
  searchQuery,
  setSearchQuery,
  priceRange,
  setPriceRange,
  sortBy,
  setSortBy,
  filterOnlyInStock,
  setFilterOnlyInStock
}) {
  const [mobileFilterOpen, setMobileFilterOpen] = useState(false);
  const [gridColumns, setGridColumns] = useState(3); // 2 | 3 | 4

  // Filter & Sort Logic
  const filteredProducts = useMemo(() => {
    let result = [...window.VELORA_DATA.products];

    // Category filter
    if (selectedCategory && selectedCategory !== 'all') {
      result = result.filter(p => p.categoryKey === selectedCategory);
    }

    // Search query filter
    if (searchQuery.trim() !== '') {
      const q = searchQuery.toLowerCase();
      result = result.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q)
      );
    }

    // Price filter
    result = result.filter(p => p.price <= priceRange);

    // In-Stock filter
    if (filterOnlyInStock) {
      result = result.filter(p => p.inStock);
    }

    // Sorting
    switch (sortBy) {
      case 'price-asc':
        result.sort((a, b) => a.price - b.price);
        break;
      case 'price-desc':
        result.sort((a, b) => b.price - a.price);
        break;
      case 'rating':
        result.sort((a, b) => b.rating - a.rating);
        break;
      case 'newest':
        result.sort((a, b) => (b.isNewArrival ? 1 : 0) - (a.isNewArrival ? 1 : 0));
        break;
      default: // 'featured'
        result.sort((a, b) => (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0));
        break;
    }

    return result;
  }, [selectedCategory, searchQuery, priceRange, filterOnlyInStock, sortBy]);

  const clearAllFilters = () => {
    setSelectedCategory('all');
    setSearchQuery('');
    setPriceRange(600);
    setFilterOnlyInStock(false);
    setSortBy('featured');
  };

  return (
    <div className="py-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      {/* Breadcrumb & Header */}
      <div className="mb-8">
        <div className="flex items-center gap-2 text-xs text-stone-500 mb-2">
          <button onClick={() => navigateTo('home')} className="hover:text-black">Home</button>
          <span>/</span>
          <span className="text-stone-900 font-semibold">Shop Outerwear</span>
        </div>
        <div className="flex flex-col md:flex-row md:items-end justify-between">
          <div>
            <h1 className="font-serif text-3xl sm:text-4xl text-stone-900 font-normal">
              Designer Jackets Catalog
            </h1>
            <p className="text-xs text-stone-500 mt-1">
              Showing {filteredProducts.length} handcrafted pieces
            </p>
          </div>

          {/* Quick Category Badges */}
          <div className="flex flex-wrap gap-2 mt-4 md:mt-0">
            {window.VELORA_DATA.categories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setSelectedCategory(cat.id)}
                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                  selectedCategory === cat.id
                    ? 'bg-[#111111] text-white shadow'
                    : 'bg-white text-stone-700 border border-[#E8DFD5] hover:bg-stone-100'
                }`}
              >
                {cat.name}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Main Grid: Sidebar Filters + Products */}
      <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">

        {/* DESKTOP SIDEBAR FILTERS */}
        <aside className="hidden lg:block space-y-6">
          <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-6">

            {/* Search Input */}
            <div>
              <label className="text-xs font-bold uppercase tracking-wider text-stone-900 block mb-2">
                Search Catalog
              </label>
              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="e.g. Leather, Selvedge..."
                  className="w-full text-xs px-3 py-2 pl-8 border border-stone-300 rounded focus:outline-none focus:border-black"
                />
                <Icon name="Search" className="w-4 h-4 text-stone-400 absolute left-2.5 top-2.5" />
              </div>
            </div>

            {/* Category Filter */}
            <div className="pt-4 border-t border-stone-200">
              <label className="text-xs font-bold uppercase tracking-wider text-stone-900 block mb-3">
                Categories
              </label>
              <div className="space-y-2">
                {window.VELORA_DATA.categories.map(cat => (
                  <button
                    key={cat.id}

                    className={`w-full text-left flex justify-between items-center text-xs py-1 transition-colors ${

          {/* Atelier Assistance Callout */}

                  <div>
                    <label className="text-xs font-bold uppercase text-stone-900 block mb-1">
                      Max Price: ${priceRange}
                    </label>
                    <input

                      min="150"

                      step="25"
                      value={priceRange}
                      onChange={(e) => setPriceRange(Number(e.target.value))}
                      className="w-full accent-[#8C6D53]"
                    />
                  </div>
                </div>
              </div>

              <div className="pt-4 border-t border-stone-200 space-y-2">
                <button
                  onClick={() => setMobileFilterOpen(false)}
                  className="w-full py-3 bg-[#111111] text-white text-xs uppercase font-bold tracking-widest rounded"
                >
                  Apply Filters ({filteredProducts.length})
                </button>
                <button
                  onClick={() => { clearAllFilters(); setMobileFilterOpen(false); }}

                  Reset
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                      <div className="sm:col-span-2 flex items-center justify-start sm:justify-center">
                        <div className="flex items-center border border-stone-300 rounded">
                          <button
                            onClick={() => updateCartQuantity(item.id, item.quantity - 1)}
                            className="px-2.5 py-1 text-xs text-stone-600 hover:bg-stone-100"
                          >
                            -
                          </button>
                          <span className="px-3 text-xs font-semibold text-stone-800 font-mono">{item.quantity}</span>
                          <button
                            onClick={() => updateCartQuantity(item.id, item.quantity + 1)}
                            className="px-2.5 py-1 text-xs text-stone-600 hover:bg-stone-100"
                          >
                            +
                          </button>
                        </div>
                      </div>

                      {/* Subtotal */}
                      <div className="sm:col-span-2 text-right font-mono text-sm font-bold text-stone-900">
                        ${product.price * item.quantity}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Cart Actions */}
            <div className="flex justify-between items-center pt-2">
              <button
                onClick={() => navigateTo('shop')}
                className="text-xs font-semibold uppercase tracking-wider text-stone-700 hover:text-black flex items-center gap-1.5"
              >
                <Icon name="ChevronLeft" className="w-4 h-4" />
                Continue Shopping
              </button>
            </div>
          </div>

          {/* Order Summary Box */}
          <div className="space-y-6">
            <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-4">
              <h2 className="font-serif text-lg font-bold text-stone-900 pb-3 border-b border-stone-200 uppercase tracking-wider">
                Order Summary
              </h2>

              <div className="space-y-3 text-xs">
                <div className="flex justify-between text-stone-600">
                  <span>Bag Subtotal</span>
                  <span className="font-mono text-stone-900 font-semibold">${cartSubtotal}</span>
                </div>

                {appliedPromo && (
                  <div className="flex justify-between text-emerald-800 font-medium">
                    <span>Voucher ({appliedPromo.code})</span>
                    <span className="font-mono">-${discountAmount}</span>
                  </div>
                )}

                <div className="flex justify-between text-stone-600">
                  <span>Estimated Shipping</span>
                  <span className="font-mono text-stone-900 font-semibold">
                    {shippingCost === 0 ? <span className="text-emerald-700">COMPLIMENTARY</span> : `$${shippingCost}`}
                  </span>
                </div>

                <div className="flex justify-between text-stone-600">
                  <span>Estimated Sales Tax (8%)</span>
                  <span className="font-mono text-stone-900 font-semibold">${estimatedTax}</span>
                </div>

                <div className="pt-3 border-t border-stone-200 flex justify-between text-base font-bold text-stone-900">
                  <span>Total Amount</span>
                  <span className="font-mono text-xl">${cartTotal}</span>
                </div>
              </div>

              {/* Promo Code Input */}
              <div className="pt-3 border-t border-stone-200">
                <label className="text-[11px] font-bold uppercase text-stone-700 block mb-1">
                  Promotional Voucher Code
                </label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={promoCode}
                    onChange={(e) => setPromoCode(e.target.value)}
                    placeholder="e.g. VELORA10"
                    className="flex-1 px-3 py-2 text-xs border border-stone-300 rounded uppercase font-mono"
                  />
                  <button
                    onClick={() => handleApplyPromo()}
                    className="px-4 py-2 bg-[#111111] text-white text-xs font-bold uppercase tracking-wider rounded hover:bg-[#8C6D53]"
                  >
                    Apply
                  </button>
                </div>
                <p className="text-[10px] text-stone-400 mt-1">Hint: Try voucher code <strong>VELORA10</strong></p>
              </div>

              {/* Checkout Button */}
              <button
                onClick={() => navigateTo('checkout')}
                className="w-full py-4 bg-[#111111] text-white text-xs uppercase tracking-[0.2em] font-bold rounded hover:bg-[#8C6D53] transition-colors shadow-lg flex items-center justify-center gap-2"
              >
                <Icon name="Lock" className="w-4 h-4" />
                Proceed to Secure Checkout
              </button>
            </div>

            <div className="p-4 bg-[#F5ECE0] rounded border border-[#E8DFD5] text-xs text-stone-600 space-y-2">
              <div className="flex items-center gap-2 font-semibold text-stone-800">
                <Icon name="ShieldCheck" className="w-4 h-4 text-[#8C6D53]" />
                Atelier Buyer Protection
              </div>
              <p>Every transaction is encrypted with 256-bit SSL protection. We never store raw payment card data.</p>
            </div>
          </div>

        </div>
      )}
    </div>
  );
}

// ----------------------------------------------------------------------------
// 9. CHECKOUT PAGE COMPONENT (Form validation, payment methods, order summary)
// ----------------------------------------------------------------------------
function CheckoutPage({
  cart,
  cartSubtotal,
  discountAmount,
  shippingCost,
  estimatedTax,
  cartTotal,
  appliedPromo,
  navigateTo,
  clearCart,
  setLastOrder,
  lastOrder,
  showToast
}) {
  const [formData, setFormData] = useState({
    firstName: '',
    lastName: '',
    email: '',
    phone: '',
    address: '',
    apartment: '',
    city: '',
    postalCode: '',
    country: 'United States',
    paymentMethod: 'card', // 'card' | 'paypal' | 'applepay' | 'cod'
    cardNumber: '4532 •••• •••• 8921',
    cardExpiry: '08/29',
    cardCvc: '842'
  });

  const [errors, setErrors] = useState({});
  const [isProcessing, setIsProcessing] = useState(false);
  const [orderComplete, setOrderComplete] = useState(false);

  const validateForm = () => {
    const errs = {};
    if (!formData.firstName.trim()) errs.firstName = "First name is required";
    if (!formData.lastName.trim()) errs.lastName = "Last name is required";
    if (!formData.email.trim() || !formData.email.includes('@')) errs.email = "Valid email is required";
    if (!formData.phone.trim()) errs.phone = "Phone number is required";
    if (!formData.address.trim()) errs.address = "Street address is required";
    if (!formData.city.trim()) errs.city = "City is required";
    if (!formData.postalCode.trim()) errs.postalCode = "Postal code is required";

    if (formData.paymentMethod === 'card') {
      if (!formData.cardNumber.trim()) errs.cardNumber = "Card number required";
      if (!formData.cardExpiry.trim()) errs.cardExpiry = "Expiry date required";
      if (!formData.cardCvc.trim()) errs.cardCvc = "CVC code required";
    }

    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handlePlaceOrder = (e) => {
    e.preventDefault();
    if (!validateForm()) {
      showToast("Please fill in all required shipping and contact details.", "error");
      return;
    }

    if (cart.length === 0) {
      showToast("Your cart is empty.", "error");
      return;
    }

    setIsProcessing(true);

    // Simulate luxury order fulfillment processing
    setTimeout(() => {
      const generatedOrder = {
        orderId: `VEL-${Math.floor(100000 + Math.random() * 900000)}`,
        date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
        items: [...cart],
        subtotal: cartSubtotal,
        discount: discountAmount,
        shipping: shippingCost,
        tax: estimatedTax,
        total: cartTotal,
        customer: { ...formData },
        estimatedDelivery: "3 to 5 business days"
      };

      setLastOrder(generatedOrder);
      clearCart();
      setIsProcessing(false);
      setOrderComplete(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 1800);
  };

  // ORDER CONFIRMATION VIEW
  if (orderComplete && lastOrder) {
    return (
      <div className="py-16 max-w-3xl mx-auto px-4">
        <div className="bg-white rounded-lg border border-[#E8DFD5] p-8 sm:p-12 shadow-xl text-center">
          <div className="w-20 h-20 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-6">
            <Icon name="PackageCheck" className="w-10 h-10" />
          </div>

          <span className="text-xs uppercase tracking-[0.3em] font-bold text-[#8C6D53] block mb-2">
            Order Confirmation
          </span>
          <h1 className="font-serif text-3xl sm:text-4xl text-stone-900 font-normal mb-2">
            Thank You For Your Patronage
          </h1>
          <p className="text-xs text-stone-500 mb-6 font-light">
            An order confirmation and courier tracking link has been dispatched to <strong>{lastOrder.customer.email}</strong>
          </p>

          <div className="p-4 bg-[#FAF7F2] rounded border border-[#E8DFD5] mb-8 inline-block font-mono text-sm text-stone-800">
            Order Reference: <strong className="text-black font-bold">{lastOrder.orderId}</strong>
          </div>

          {/* Receipt Breakdown */}
          <div className="text-left border-t border-b border-stone-200 py-6 mb-8 space-y-4">
            <h3 className="text-xs font-bold uppercase tracking-wider text-stone-900">
              Ordered Outerwear:
            </h3>
            {lastOrder.items.map(item => {
              const product = window.VELORA_DATA.products.find(p => p.id === item.productId);
              if (!product) return null;
              return (
                <div key={item.id} className="flex justify-between items-center text-xs">
                  <div className="flex items-center gap-3">
                    <img src={product.images[0]} alt={product.name} className="w-12 h-14 object-cover rounded" />
                    <div>
                      <h4 className="font-semibold text-stone-900">{product.name}</h4>
                      <p className="text-stone-500">Size: {item.size} • Color: {item.color} • Qty: {item.quantity}</p>
                    </div>
                  </div>
                  <span className="font-mono font-bold text-stone-900">${product.price * item.quantity}</span>
                </div>
              );
            })}

            <div className="pt-4 border-t border-stone-100 text-xs space-y-1.5 font-mono">
              <div className="flex justify-between text-stone-600">
                <span>Subtotal:</span>
                <span>${lastOrder.subtotal}</span>
              </div>
              {lastOrder.discount > 0 && (
                <div className="flex justify-between text-emerald-800">
                  <span>Discount:</span>
                  <span>-${lastOrder.discount}</span>
                </div>
              )}
              <div className="flex justify-between text-stone-600">
                <span>Shipping:</span>
                <span>{lastOrder.shipping === 0 ? 'Complimentary' : `$${lastOrder.shipping}`}</span>
              </div>
              <div className="flex justify-between text-stone-600">
                <span>Taxes:</span>
                <span>${lastOrder.tax}</span>
              </div>
              <div className="flex justify-between text-sm font-bold text-stone-900 pt-2 border-t border-stone-200">
                <span>Total Paid:</span>
                <span>${lastOrder.total}</span>
              </div>
            </div>
          </div>

          {/* Delivery Details */}
          <div className="text-left bg-stone-50 p-4 rounded text-xs text-stone-600 mb-8">
            <div className="font-bold text-stone-900 mb-1">Delivering to:</div>
            <div>{lastOrder.customer.firstName} {lastOrder.customer.lastName}</div>
            <div>{lastOrder.customer.address}</div>
            <div>{lastOrder.customer.city}, {lastOrder.customer.postalCode}, {lastOrder.customer.country}</div>
            <div className="mt-2 text-stone-400">Estimated Delivery: {lastOrder.estimatedDelivery}</div>
          </div>

          <div className="flex justify-center gap-4">
            <button
              onClick={() => navigateTo('shop')}
              className="px-8 py-3.5 bg-[#111111] text-white text-xs uppercase tracking-widest font-bold rounded hover:bg-[#8C6D53] transition-colors"
            >
              Continue Shopping
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="py-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div className="flex items-center gap-2 text-xs text-stone-500 mb-6">
        <button onClick={() => navigateTo('home')} className="hover:text-black">Home</button>
        <span>/</span>
        <button onClick={() => navigateTo('cart')} className="hover:text-black">Shopping Bag</button>
        <span>/</span>
        <span className="text-stone-900 font-semibold">Checkout</span>
      </div>

      <h1 className="font-serif text-3xl text-stone-900 font-normal mb-8">
        Secure Atelier Checkout
      </h1>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">

        {/* CHECKOUT FORM */}
        <div className="lg:col-span-7">
          <form onSubmit={handlePlaceOrder} className="space-y-8">

            {/* Step 1: Customer Contact Info */}
            <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-4">
              <div className="flex items-center gap-2 pb-3 border-b border-stone-200">
                <span className="w-6 h-6 rounded-full bg-[#111111] text-white text-xs flex items-center justify-center font-bold">1</span>
                <h2 className="text-sm font-bold uppercase tracking-wider text-stone-900">
                  Client Contact Information
                </h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    First Name <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.firstName}
                    onChange={(e) => setFormData({ ...formData, firstName: e.target.value })}
                    placeholder="e.g. Julianna"
                    className={`w-full text-xs p-2.5 border rounded ${errors.firstName ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.firstName && <span className="text-[10px] text-rose-600">{errors.firstName}</span>}
                </div>

                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    Last Name <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.lastName}
                    onChange={(e) => setFormData({ ...formData, lastName: e.target.value })}
                    placeholder="e.g. Claire"
                    className={`w-full text-xs p-2.5 border rounded ${errors.lastName ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.lastName && <span className="text-[10px] text-rose-600">{errors.lastName}</span>}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    Email Address <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    placeholder="e.g. julianna@velora.com"
                    className={`w-full text-xs p-2.5 border rounded ${errors.email ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.email && <span className="text-[10px] text-rose-600">{errors.email}</span>}
                </div>

                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    Phone Number <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="tel"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    placeholder="e.g. +1 (555) 234-5678"
                    className={`w-full text-xs p-2.5 border rounded ${errors.phone ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.phone && <span className="text-[10px] text-rose-600">{errors.phone}</span>}
                </div>
              </div>
            </div>

            {/* Step 2: Shipping Destination */}
            <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-4">
              <div className="flex items-center gap-2 pb-3 border-b border-stone-200">
                <span className="w-6 h-6 rounded-full bg-[#111111] text-white text-xs flex items-center justify-center font-bold">2</span>
                <h2 className="text-sm font-bold uppercase tracking-wider text-stone-900">
                  Delivery Destination
                </h2>
              </div>

              <div>
                <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                  Street Address <span className="text-rose-500">*</span>
                </label>
                <input
                  type="text"
                  value={formData.address}
                  onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                  placeholder="e.g. 740 Park Avenue"
                  className={`w-full text-xs p-2.5 border rounded ${errors.address ? 'border-rose-500' : 'border-stone-300'}`}
                />
                {errors.address && <span className="text-[10px] text-rose-600">{errors.address}</span>}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    City <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.city}
                    onChange={(e) => setFormData({ ...formData, city: e.target.value })}
                    placeholder="New York"
                    className={`w-full text-xs p-2.5 border rounded ${errors.city ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.city && <span className="text-[10px] text-rose-600">{errors.city}</span>}
                </div>

                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    Postal / Zip Code <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.postalCode}
                    onChange={(e) => setFormData({ ...formData, postalCode: e.target.value })}
                    placeholder="10021"
                    className={`w-full text-xs p-2.5 border rounded ${errors.postalCode ? 'border-rose-500' : 'border-stone-300'}`}
                  />
                  {errors.postalCode && <span className="text-[10px] text-rose-600">{errors.postalCode}</span>}
                </div>

                <div>
                  <label className="text-xs font-bold uppercase text-stone-700 block mb-1">
                    Country
                  </label>
                  <select
                    value={formData.country}
                    onChange={(e) => setFormData({ ...formData, country: e.target.value })}
                    className="w-full text-xs p-2.5 border border-stone-300 rounded bg-white"
                  >
                    <option>United States</option>
                    <option>United Kingdom</option>
                    <option>France</option>
                    <option>Germany</option>
                    <option>Switzerland</option>
                    <option>Canada</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Step 3: Payment Method */}
            <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-4">
              <div className="flex items-center gap-2 pb-3 border-b border-stone-200">
                <span className="w-6 h-6 rounded-full bg-[#111111] text-white text-xs flex items-center justify-center font-bold">3</span>
                <h2 className="text-sm font-bold uppercase tracking-wider text-stone-900">
                  Payment Method
                </h2>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {[
                  { id: 'card', label: 'Credit Card', icon: 'CreditCard' },
                  { id: 'applepay', label: 'Apple Pay', icon: 'Sparkles' },
                  { id: 'paypal', label: 'PayPal', icon: 'Lock' },
                  { id: 'cod', label: 'Cash On Delivery', icon: 'Truck' }
                ].map(pm => (
                  <button
                    key={pm.id}
                    type="button"
                    onClick={() => setFormData({ ...formData, paymentMethod: pm.id })}
                    className={`p-3 rounded border text-center transition-all ${
                      formData.paymentMethod === pm.id
                        ? 'border-[#8C6D53] bg-[#FAF7F2] font-bold text-stone-900 shadow-sm'
                        : 'border-stone-200 text-stone-600 hover:border-stone-400'
                    }`}
                  >
                    <Icon name={pm.icon} className="w-5 h-5 mx-auto mb-1 text-stone-800" />
                    <span className="text-[11px] block">{pm.label}</span>
                  </button>
                ))}
              </div>

              {formData.paymentMethod === 'card' && (
                <div className="p-4 bg-stone-50 rounded border border-stone-200 space-y-3 mt-4">
                  <div>
                    <label className="text-[11px] font-bold uppercase text-stone-700 block mb-1">
                      Card Number
                    </label>
                    <input
                      type="text"
                      value={formData.cardNumber}
                      onChange={(e) => setFormData({ ...formData, cardNumber: e.target.value })}
                      placeholder="4532 •••• •••• 8921"
                      className="w-full text-xs p-2.5 bg-white border border-stone-300 rounded font-mono"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-bold uppercase text-stone-700 block mb-1">
                        Expiry Date
                      </label>
                      <input
                        type="text"
                        value={formData.cardExpiry}
                        onChange={(e) => setFormData({ ...formData, cardExpiry: e.target.value })}
                        placeholder="MM/YY"
                        className="w-full text-xs p-2.5 bg-white border border-stone-300 rounded font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold uppercase text-stone-700 block mb-1">
                        CVC / CVV
                      </label>
                      <input
                        type="text"
                        value={formData.cardCvc}
                        onChange={(e) => setFormData({ ...formData, cardCvc: e.target.value })}
                        placeholder="842"
                        className="w-full text-xs p-2.5 bg-white border border-stone-300 rounded font-mono"
                      />
                    </div>
                  </div>
                </div>
              )}

              {formData.paymentMethod === 'cod' && (
                <div className="p-3 bg-amber-50 rounded text-xs text-amber-800 border border-amber-200">
                  Cash on Delivery selected. Please have the exact payment amount ready upon white-glove courier arrival.
                </div>
              )}

              {/* Place Order CTA Button */}
              <div className="pt-4">
                <button
                  type="submit"
                  disabled={isProcessing}
                  className="w-full py-4 bg-[#111111] text-white text-xs uppercase tracking-[0.25em] font-bold rounded hover:bg-[#8C6D53] transition-all shadow-xl flex items-center justify-center gap-2"
                >
                  {isProcessing ? (
                    <>
                      <Icon name="RefreshCw" className="w-4 h-4 animate-spin" />
                      Authorizing Transaction...
                    </>
                  ) : (
                    <>
                      <Icon name="Lock" className="w-4 h-4" />
                      Place Order • ${cartTotal}
                    </>
                  )}
                </button>
              </div>

            </div>

          </form>
        </div>

        {/* ORDER RECAP SIDEBAR */}
        <div className="lg:col-span-5">
          <div className="bg-white p-6 rounded border border-[#E8DFD5] shadow-sm space-y-4 sticky top-28">
            <h3 className="font-serif text-lg font-bold text-stone-900 pb-3 border-b border-stone-200">
              Order Summary ({cart.length})
            </h3>

            <div className="max-h-64 overflow-y-auto divide-y divide-stone-100 pr-1">
              {cart.map(item => {
                const product = window.VELORA_DATA.products.find(p => p.id === item.productId);
                if (!product) return null;
                return (
                  <div key={item.id} className="py-3 flex items-center gap-3">
                    <img src={product.images[0]} alt={product.name} className="w-14 h-16 object-cover rounded" />
                    <div className="flex-1">
                      <h4 className="text-xs font-semibold text-stone-900 line-clamp-1">{product.name}</h4>
                      <p className="text-[11px] text-stone-500">Size {item.size} • Qty {item.quantity}</p>
                    </div>
                    <span className="font-mono text-xs font-bold text-stone-900">${product.price * item.quantity}</span>
                  </div>

              })}

            <div className="pt-3 border-t border-stone-200 space-y-2 text-xs">
              <div className="flex justify-between text-stone-600">
                <span>Subtotal</span>
                <span className="font-mono text-stone-900 font-semibold">${cartSubtotal}</span>
              </div>

    name: '',

  const [isSubmitting, setIsSubmitting] = useState(false);

  const [submissionRef, setSubmissionRef] = useState('');

  // Web3Forms Verified Access Key
  const WEB3FORMS_ACCESS_KEY = "fa3909a5-0485-4350-b720-a2660a3f20bf";

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!contactForm.name.trim() || !contactForm.email.trim() || !contactForm.message.trim()) {
      showToast("Please fill in all required fields.", "error");
      return;
    }

    setIsSubmitting(true);

    try {
      // 1. Primary Submission: Web3Forms REST API
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          name: contactForm.name.trim(),
          email: contactForm.email.trim(),
          subject: contactForm.subject.trim() || "New Client Inquiry - VELORA Luxury Outerwear",
          message: contactForm.message.trim(),
          from_name: "VELORA Luxury Atelier Concierge"
        })
      });

      const data = await response.json();

      if (data.success) {
        const refId = "VEL-MSG-" + Math.floor(100000 + Math.random() * 900000);
        setSubmissionRef(refId);
        setFormSubmitted(true);
        showToast("Your inquiry was delivered to the VELORA concierge inbox!");
      } else {
        showToast(data.message || "Submission failed. Please try again.", "error");
      }
    } catch (err) {
      // 2. Resilient Fallback for local environments or strict browser security
      try {
        const fallbackForm = document.getElementById("velora_web3forms_native");
        if (fallbackForm) {
          fallbackForm.submit();
          const refId = "VEL-MSG-" + Math.floor(100000 + Math.random() * 900000);

          setFormSubmitted(true);
          showToast("Your message was dispatched to the VELORA concierge!");

      setIsSubmitting(false);

                onChange={(e) => setName(e.target.value)}
                placeholder="Eleanor Vance"
                className="w-full text-xs p-2.5 border border-stone-300 rounded outline-none"
                required
              />
            </div>
          )}

          <div>
            <label className="text-xs font-bold uppercase text-stone-700 block mb-1">Email Address</label>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="client@velora.com"
              className="w-full text-xs p-2.5 border border-stone-300 rounded outline-none"
              required
            />
          </div>

          <div>
            <div className="flex justify-between items-center mb-1">
              <label className="text-xs font-bold uppercase text-stone-700">Password</label>
              {authMode === 'login' && (
                <button type="button" className="text-[10px] text-[#8C6D53] hover:underline">
                  Forgot password?
                </button>
              )}
            </div>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full text-xs p-2.5 border border-stone-300 rounded outline-none font-mono"
              required
            />
          </div>

          <button
            type="submit"
            className="w-full py-3 bg-[#111111] text-white text-xs uppercase tracking-[0.2em] font-bold rounded hover:bg-[#8C6D53] transition-colors shadow"
          >
            {authMode === 'login' ? 'Sign In To Account' : 'Register New Client'}
          </button>

          <div className="text-center pt-2">
            <span className="text-[11px] text-stone-500">
              Demo credentials prefilled for university presentation evaluation.
            </span>
          </div>
        </form>
      </div>
    </div>
  );
}
